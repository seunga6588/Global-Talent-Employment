<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>학습평가 응시 | 학생 통합관리 시스템</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="../css/style.css" rel="stylesheet">
</head>
<body>
<div class="site-header">
  <div>
    <p class="title-main">2026 글로벌 인재 취업 선도대학</p>
    <p class="title-sub">학생 학습평가</p>
  </div>
</div>

<div class="container py-4" style="max-width:640px;">

  <!-- STEP 1: 학번 입력 -->
  <div class="panel" id="stepStudentNo">
    <div class="panel-title">학번 입력</div>
    <div class="mb-2">
      <input type="text" class="form-control" id="studentNoInput" placeholder="학번을 입력하세요">
    </div>
    <div id="lookupError" class="text-danger mb-2" style="font-size:13px; display:none;"></div>
    <button class="btn btn-navy w-100" id="lookupBtn">확인</button>
  </div>

  <!-- STEP 2: 본인 확인 -->
  <div class="panel" id="stepConfirm" style="display:none;">
    <div class="panel-title" id="confirmText"></div>
    <div class="d-flex gap-2">
      <button class="btn btn-navy flex-fill" id="confirmYesBtn">예, 맞습니다</button>
      <button class="btn btn-outline-navy flex-fill" id="confirmNoBtn">아니요</button>
    </div>
  </div>

  <!-- STEP 3: 이수 현황 안내 / 응시 불가 안내 -->
  <div class="panel" id="stepExamList" style="display:none;">
    <div class="panel-title" id="examListTitle">안내</div>
    <div id="examListArea"></div>
  </div>

  <!-- STEP 4: 시험 응시 -->
  <div class="panel" id="stepExam" style="display:none;">
    <div class="d-flex justify-content-between mb-2">
      <div class="panel-title mb-0" id="examTitleText"></div>
      <div class="exam-progress-text" id="examProgressText"></div>
    </div>
    <div id="questionArea"></div>
    <button class="btn btn-pink w-100 mt-3" id="submitExamBtn">답안 제출</button>
  </div>

  <!-- STEP 5: 결과 -->
  <div class="panel text-center" id="stepResult" style="display:none;">
    <div class="panel-title">제출 완료</div>
    <p id="resultText" style="font-size:16px;"></p>
    <a href="exam.html" class="btn btn-outline-navy mt-2">처음으로</a>
  </div>

  <div id="messageBox" class="text-danger mt-2" style="font-size:13px;"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>
<script src="../js/student-exam.js"></script>
</body>
</html>
