<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>관리자 로그인 | 학생 통합관리 시스템</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<div class="center-screen">
  <div class="auth-card">
    <p class="mb-1" style="color:var(--pink); font-weight:700; font-size:13px;">2026 글로벌 인재 취업 선도대학</p>
    <h5 class="mb-4" style="color:var(--navy); font-weight:800;">관리자 로그인</h5>

    <form id="loginForm">
      <div class="mb-3">
        <label class="form-label">이메일</label>
        <input type="email" class="form-control" id="email" required>
      </div>
      <div class="mb-3">
        <label class="form-label">비밀번호</label>
        <input type="password" class="form-control" id="password" required>
      </div>
      <div id="loginError" class="text-danger mb-3" style="font-size:13px; display:none;"></div>
      <button type="submit" class="btn btn-navy w-100 py-2">로그인</button>
    </form>

    <div class="text-center mt-3">
      <a href="index.html" style="font-size:13px; color:var(--text-sub);">← 처음으로 돌아가기</a>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>
<script>
document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const errBox = document.getElementById("loginError");
  errBox.style.display = "none";

  const result = await handleLogin(email, password);
  if (result.success) {
    window.location.href = "admin/dashboard.html";
  } else {
    errBox.textContent = result.message;
    errBox.style.display = "block";
  }
});

// 이미 로그인되어 있으면 바로 대시보드로 이동
(async () => {
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (session) window.location.href = "admin/dashboard.html";
})();
</script>
</body>
</html>
