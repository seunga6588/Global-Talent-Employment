<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>학생 상세 | 학생 통합관리 시스템</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="../css/style.css" rel="stylesheet">
</head>
<body>
<div id="layoutHeader"></div>
<div class="app-layout">
  <div id="layoutSidebar"></div>

  <div class="main-content">
    <a href="students.html" class="d-inline-block mb-3" style="font-size:13px; color:var(--text-sub);">← 전체 학생 목록으로</a>

    <div class="panel" id="basicInfoPanel">불러오는 중...</div>

    <div class="panel">
      <div class="panel-title">교육 이수 현황</div>
      <table class="data-table">
        <thead>
          <tr><th>프로그램</th><th class="text-end">필수시간</th><th class="text-end">이수시간</th><th>이수여부</th><th>학습평가</th><th class="text-end">평가점수</th><th></th></tr>
        </thead>
        <tbody id="enrollmentBody"><tr><td colspan="8" class="text-center text-muted py-3">불러오는 중...</td></tr></tbody>
      </table>

      <div class="mt-4">
        <div class="d-flex justify-content-between mb-1" style="font-size:13px;">
          <span id="hoursText">- / -</span>
          <span id="rateText" style="font-weight:700; color:var(--navy);">전체 이수율 -</span>
        </div>
        <div class="progress-wrap"><div class="progress-bar-fill" id="rateBar" style="width:0%;"></div></div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-title">취업 여부</div>
      <input type="text" class="form-control" id="employmentBox" placeholder="예: 취업확정 / 인턴 중 / 미정">
      <button class="btn btn-navy btn-sm mt-2" id="saveEmploymentBtn">취업여부 저장</button>
    </div>

    <div class="panel">
      <div class="panel-title">관리자 메모</div>
      <textarea class="form-control" id="memoBox" rows="3"></textarea>
      <button class="btn btn-navy btn-sm mt-2" id="saveMemoBtn">메모 저장</button>
    </div>
  </div>
</div>

<!-- 이수시간 수정 모달 -->
<div class="modal fade" id="editEnrollModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header"><h6 class="modal-title" id="editEnrollTitle">이수현황 수정</h6><button class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <div class="mb-2">
          <label class="form-label small">이수여부</label>
          <select class="form-select form-select-sm" id="editStatus">
            <option value="이수">이수</option><option value="패스">패스</option><option value="진행중">진행중</option><option value="미이수">미이수</option>
          </select>
        </div>
        <div class="mb-2">
          <label class="form-label small">이수시간</label>
          <input type="number" min="0" step="0.5" class="form-control form-control-sm" id="editHours">
        </div>
      </div>
      <div class="modal-footer"><button class="btn btn-navy btn-sm" id="saveEnrollBtn">저장</button></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/student-detail.js"></script>
</body>
</html>
