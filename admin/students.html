<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>학생관리 | 학생 통합관리 시스템</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="../css/style.css" rel="stylesheet">
</head>
<body>
<div id="layoutHeader"></div>
<div class="app-layout">
  <div id="layoutSidebar"></div>

  <div class="main-content">
    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
      <h5 class="mb-0" style="font-weight:800; color:var(--navy);">전체 학생</h5>
      <div class="d-flex gap-2 flex-wrap">
        <input type="file" id="excelFile" accept=".xlsx,.xls,.csv" class="form-control form-control-sm" style="width:220px;">
        <button class="btn btn-outline-navy btn-sm" id="uploadExcelBtn">엑셀 일괄등록</button>
        <button class="btn btn-outline-navy btn-sm" id="downloadExcelBtn">전체 학생현황 다운로드</button>
        <button class="btn btn-pink btn-sm" data-bs-toggle="modal" data-bs-target="#addStudentModal">+ 학생 추가</button>
      </div>
    </div>

    <!-- 검색/필터 -->
    <div class="panel">
      <div class="row g-2">
        <div class="col-md-3">
          <input type="text" id="fSearch" class="form-control form-control-sm" placeholder="이름 또는 학번 검색">
        </div>
        <div class="col-md-2">
          <input type="text" id="fDept" class="form-control form-control-sm" placeholder="학과">
        </div>
        <div class="col-md-2">
          <input type="text" id="fNationality" class="form-control form-control-sm" placeholder="국적">
        </div>
        <div class="col-md-2">
          <select id="fTopik" class="form-select form-select-sm">
            <option value="">TOPIK 전체</option>
            <option>1급</option><option>2급</option><option>3급</option><option>4급</option><option>5급</option><option>6급</option><option>미응시</option>
          </select>
        </div>
        <div class="col-md-2">
          <select id="fStatus" class="form-select form-select-sm">
            <option value="">이수상태 전체</option>
            <option value="이수">이수</option>
            <option value="진행중">진행중</option>
            <option value="미이수">미이수</option>
          </select>
        </div>
        <div class="col-md-1">
          <button class="btn btn-navy btn-sm w-100" id="applyFilterBtn">검색</button>
        </div>
      </div>
    </div>

    <div class="panel">
      <table class="data-table">
        <thead>
          <tr>
            <th>학번</th><th>이름</th><th>학과</th><th>국적</th><th>TOPIK</th>
            <th>K-WORK</th><th class="text-end">이수시간</th><th class="text-end">이수율</th>
            <th class="text-end">평가점수</th><th>상태</th>
          </tr>
        </thead>
        <tbody id="studentsBody">
          <tr><td colspan="10" class="text-center text-muted py-3">불러오는 중...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- 학생 추가 모달 -->
<div class="modal fade" id="addStudentModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header"><h6 class="modal-title">학생 추가</h6><button class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <form id="addStudentForm">
          <div class="row g-2">
            <div class="col-6"><label class="form-label small">학번*</label><input required class="form-control form-control-sm" name="student_no"></div>
            <div class="col-6"><label class="form-label small">이름*</label><input required class="form-control form-control-sm" name="name"></div>
            <div class="col-6"><label class="form-label small">학과</label><input class="form-control form-control-sm" name="department"></div>
            <div class="col-6"><label class="form-label small">성별</label>
              <select class="form-select form-select-sm" name="gender"><option value="">선택</option><option>남</option><option>여</option></select>
            </div>
            <div class="col-6"><label class="form-label small">국적</label><input class="form-control form-control-sm" name="nationality"></div>
            <div class="col-6"><label class="form-label small">연락처</label><input class="form-control form-control-sm" name="phone"></div>
            <div class="col-6"><label class="form-label small">K-WORK ID</label><input class="form-control form-control-sm" name="kwork_id"></div>
            <div class="col-6"><label class="form-label small">TOPIK 급수</label><input class="form-control form-control-sm" name="topik_level"></div>
            <div class="col-12"><label class="form-label small">비고</label><textarea class="form-control form-control-sm" name="memo" rows="2"></textarea></div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-navy btn-sm" id="submitAddStudent">저장</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="../js/supabase.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/students.js"></script>
</body>
</html>
