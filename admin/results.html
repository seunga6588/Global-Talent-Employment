<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>시험 결과 | 학생 통합관리 시스템</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="../css/style.css" rel="stylesheet">
</head>
<body>
<div id="layoutHeader"></div>
<div class="app-layout">
  <div id="layoutSidebar"></div>

  <div class="main-content">
    <h5 class="mb-3" style="font-weight:800; color:var(--navy);">학습평가 - 시험 결과 / 미응시자</h5>

    <div class="panel">
      <div class="row g-2 align-items-end">
        <div class="col-md-4">
          <label class="form-label small">시험 선택</label>
          <select class="form-select form-select-sm" id="examSelect"></select>
        </div>
        <div class="col-md-3">
          <button class="btn btn-outline-navy btn-sm" id="downloadResultsBtn">시험결과 다운로드</button>
        </div>
      </div>
    </div>

    <div class="row g-3 mb-2">
      <div class="col-6 col-md-2"><div class="stat-card"><div class="stat-label">응시대상자</div><div class="stat-value" id="statTarget">-</div></div></div>
      <div class="col-6 col-md-2"><div class="stat-card"><div class="stat-label">응시자</div><div class="stat-value" id="statTakers">-</div></div></div>
      <div class="col-6 col-md-2"><div class="stat-card"><div class="stat-label">미응시자</div><div class="stat-value" id="statAbsent">-</div></div></div>
      <div class="col-6 col-md-2"><div class="stat-card"><div class="stat-label">응시율</div><div class="stat-value pink" id="statRate">-</div></div></div>
      <div class="col-6 col-md-2"><div class="stat-card"><div class="stat-label">평균점수</div><div class="stat-value pink" id="statAvg">-</div></div></div>
      <div class="col-6 col-md-2"><div class="stat-card"><div class="stat-label">최고 / 최저</div><div class="stat-value pink" id="statMinMax">-</div></div></div>
    </div>

    <div class="panel">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <div class="panel-title mb-0">응시 결과</div>
        <div class="form-check form-switch">
          <input class="form-check-input" type="checkbox" id="showAbsentOnly">
          <label class="form-check-label small" for="showAbsentOnly">미응시 학생만 보기</label>
        </div>
      </div>
      <table class="data-table">
        <thead><tr><th>학번</th><th>이름</th><th>시험명</th><th class="text-end">점수</th><th class="text-end">정답수</th><th>제출일시</th></tr></thead>
        <tbody id="resultsBody"><tr><td colspan="6" class="text-center text-muted py-3">시험을 선택해주세요.</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="../js/supabase.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/results.js"></script>
</body>
</html>
