<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard | 학생 통합관리 시스템</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="../css/style.css" rel="stylesheet">
</head>
<body>
<div id="layoutHeader"></div>
<div class="app-layout">
  <div id="layoutSidebar"></div>

  <div class="main-content">
    <h5 class="mb-3" style="font-weight:800; color:var(--navy);">전체 현황 (Dashboard)</h5>

    <!-- 요약 카드 -->
    <div class="row g-3 mb-2">
      <div class="col-6 col-md-3">
        <div class="stat-card"><div class="stat-label">전체 참여학생</div><div class="stat-value" id="statTotalStudents">-</div></div>
      </div>
      <div class="col-6 col-md-3">
        <div class="stat-card"><div class="stat-label">교육 이수 완료</div><div class="stat-value" id="statCompleted">-</div></div>
      </div>
      <div class="col-6 col-md-3">
        <div class="stat-card"><div class="stat-label">교육 진행중</div><div class="stat-value" id="statInProgress">-</div></div>
      </div>
      <div class="col-6 col-md-3">
        <div class="stat-card"><div class="stat-label">미이수 학생</div><div class="stat-value" id="statNotStarted">-</div></div>
      </div>
    </div>
    <div class="row g-3 mb-4">
      <div class="col-6 col-md-3">
        <div class="stat-card"><div class="stat-label">총 교육 운영시간</div><div class="stat-value pink" id="statTotalHours">-</div></div>
      </div>
      <div class="col-6 col-md-3">
        <div class="stat-card"><div class="stat-label">평균 이수시간</div><div class="stat-value pink" id="statAvgHours">-</div></div>
      </div>
      <div class="col-6 col-md-3">
        <div class="stat-card"><div class="stat-label">학습평가 응시자</div><div class="stat-value pink" id="statExamTakers">-</div></div>
      </div>
      <div class="col-6 col-md-3">
        <div class="stat-card"><div class="stat-label">학습평가 평균점수</div><div class="stat-value pink" id="statExamAvg">-</div></div>
      </div>
    </div>

    <!-- 그래프 -->
    <div class="row g-3">
      <div class="col-md-6">
        <div class="panel">
          <div class="panel-title">프로그램별 이수율</div>
          <canvas id="chartCompletionRate" height="220"></canvas>
        </div>
      </div>
      <div class="col-md-6">
        <div class="panel">
          <div class="panel-title">프로그램별 평균 학습평가 점수</div>
          <canvas id="chartExamAvg" height="220"></canvas>
        </div>
      </div>
      <div class="col-md-6">
        <div class="panel">
          <div class="panel-title">학생별 교육 이수현황(이수시간 상위 10명)</div>
          <canvas id="chartStudentHours" height="220"></canvas>
        </div>
      </div>
      <div class="col-md-6">
        <div class="panel">
          <div class="panel-title">TOPIK 급수별 학생 분포</div>
          <canvas id="chartTopik" height="220"></canvas>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-title">최근 시험 제출 학생</div>
      <table class="data-table">
        <thead><tr><th>학번</th><th>이름</th><th>시험명</th><th>점수</th><th>제출일시</th></tr></thead>
        <tbody id="recentAttemptsBody"><tr><td colspan="5" class="text-center text-muted py-3">불러오는 중...</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/dashboard.js"></script>
</body>
</html>
