<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>교육관리 | 학생 통합관리 시스템</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="../css/style.css" rel="stylesheet">
</head>
<body>
<div id="layoutHeader"></div>
<div class="app-layout">
  <div id="layoutSidebar"></div>

  <div class="main-content">
    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
      <h5 class="mb-0" style="font-weight:800; color:var(--navy);">교육 프로그램 관리</h5>
      <div class="d-flex gap-2 flex-wrap">
        <button class="btn btn-outline-navy btn-sm" id="downloadProgramTemplateBtn">엑셀 양식 다운로드</button>
        <input type="file" id="programExcelFile" accept=".xlsx,.xls,.csv" class="form-control form-control-sm" style="width:220px;">
        <button class="btn btn-outline-navy btn-sm" id="uploadProgramExcelBtn">엑셀 일괄등록</button>
        <button class="btn btn-pink btn-sm" data-bs-toggle="modal" data-bs-target="#programModal" onclick="openAddProgram()">+ 프로그램 추가</button>
      </div>
    </div>

    <div class="panel">
      <table class="data-table">
        <thead>
          <tr><th>프로그램명</th><th>동일과목 그룹</th><th>교육일정</th><th class="text-end">이수한 학생 수</th><th></th></tr>
        </thead>
        <tbody id="programsBody"><tr><td colspan="5" class="text-center text-muted py-3">불러오는 중...</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<!-- 프로그램 추가/수정 모달 -->
<div class="modal fade" id="programModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header"><h6 class="modal-title" id="programModalTitle">프로그램 추가</h6><button class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <form id="programForm">
          <input type="hidden" name="id">
          <div class="row g-2">
            <div class="col-12"><label class="form-label small">프로그램명*</label><input required class="form-control form-control-sm" name="name"></div>
            <div class="col-6">
              <label class="form-label small">교육 구분</label>
              <select class="form-select form-select-sm" name="category">
                <option value="교과">교과</option>
                <option value="비교과">비교과</option>
              </select>
            </div>
            <div class="col-6"><label class="form-label small">시작일</label><input type="date" class="form-control form-control-sm" name="edu_date" id="programStartDate"></div>
            <div class="col-6"><label class="form-label small">종료일</label><input type="date" class="form-control form-control-sm" name="edu_end_date" id="programEndDate"></div>
            <div class="col-6"><label class="form-label small">인정 이수시간</label><input type="number" step="0.5" min="0" class="form-control form-control-sm" name="required_hours" value="2"></div>
            <div class="col-6"><label class="form-label small">담당자</label><input class="form-control form-control-sm" name="manager_name"></div>
            <div class="col-12"><label class="form-label small">이수기준</label><input class="form-control form-control-sm" name="completion_criteria" placeholder="예: 필수시간 100% 참석"></div>
            <div class="col-12">
              <label class="form-label small">동일과목 그룹 <span class="text-muted">(선택)</span></label>
              <input class="form-control form-control-sm" name="equivalent_group" placeholder="예: 근로기준과 산업안전">
              <p class="text-muted mt-1 mb-0" style="font-size:11.5px;">
                같은 값을 입력한 프로그램들은 "사실상 같은 과목(공통교과/비교과/글산과 버전 등)"으로 취급되어,
                한 학생 기준으로 패스가 아닌 트랙 하나만 이수시간·필요시간 계산에 반영됩니다.
              </p>
            </div>

            <div class="col-12 mt-2">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="hasSectionsCheck" onchange="toggleSectionsUI(this.checked)">
                <label class="form-check-label small" for="hasSectionsCheck">
                  분반 사용 (학과마다 시작일/종료일이 다른 경우)
                </label>
              </div>
            </div>

            <div class="col-12" id="sectionsContainer" style="display:none;">
              <div class="d-flex justify-content-between align-items-center mt-1 mb-1">
                <span class="small text-muted">학과별 일정</span>
                <button type="button" class="btn btn-outline-navy btn-sm" onclick="addSectionRow()">+ 학과 일정 추가</button>
              </div>
              <div id="sectionsRows"></div>
              <p class="text-muted mt-1" style="font-size:12px;">분반을 사용하면 위의 시작일/종료일 대신 이 학과별 일정이 표시됩니다.</p>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer"><button class="btn btn-navy btn-sm" id="saveProgramBtn">저장</button></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="../js/supabase.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/programs.js"></script>
</body>
</html>
