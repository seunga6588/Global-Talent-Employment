<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>학과별 인원 설정 | 학생 통합관리 시스템</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="../css/style.css" rel="stylesheet">
</head>
<body>
<div id="layoutHeader"></div>
<div class="app-layout">
  <div id="layoutSidebar"></div>

  <div class="main-content">
    <h5 class="mb-2" style="font-weight:800; color:var(--navy);">학과별 우수학생 선정 인원 설정</h5>
    <p class="text-muted mb-3" style="font-size:13px;">
      학과별로 우수학생으로 선정(등급 부여)할 수 있는 최대 인원을 설정합니다.
      정원을 초과해서 등급을 매기려고 하면 평가 화면에서 저장이 막히고 경고 문구가 표시됩니다.
    </p>

    <div class="panel">
      <table class="data-table">
        <thead>
          <tr><th>학과</th><th class="text-end">현재 선정 인원(등급 부여됨)</th><th style="width:160px;">정원</th><th style="width:100px;"></th></tr>
        </thead>
        <tbody id="quotaBody"><tr><td colspan="4" class="text-center text-muted py-3">불러오는 중...</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/dept-quota.js"></script>
</body>
</html>
