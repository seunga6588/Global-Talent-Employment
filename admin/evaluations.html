<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>우수학생 평가 | 학생 통합관리 시스템</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="../css/style.css" rel="stylesheet">
</head>
<body>
<div id="layoutHeader"></div>
<div class="app-layout">
  <div id="layoutSidebar"></div>

  <div class="main-content">
    <div class="d-flex justify-content-between align-items-center mb-2 flex-wrap gap-2">
      <h5 class="mb-0" style="font-weight:800; color:var(--navy);">우수학생 평가</h5>
      <div id="deptFilterArea"></div>
    </div>
    <p class="text-muted mb-3" style="font-size:13px;">
      2025년 글로벌 인재 취업 선도대학 우수학생 평가 기준(총 100점)에 따라 학과별로 학생을 평가합니다.
      <b>S등급(90점↑) 500,000원 · A등급(80~89점) 300,000원 · B등급(70~79점) 200,000원</b>
    </p>

    <div class="panel">
      <div class="mb-2"><input type="text" id="evalSearch" class="form-control form-control-sm" style="max-width:280px;" placeholder="이름 또는 학번 검색" oninput="renderEvalTable()"></div>
      <table class="data-table">
        <thead>
          <tr>
            <th>학번</th><th>이름</th><th>학과</th>
            <th class="text-end">이수시간</th><th>취업여부</th><th class="text-end">학습평가</th>
            <th class="text-end">평가점수</th><th>등급</th><th></th>
          </tr>
        </thead>
        <tbody id="evalBody"><tr><td colspan="9" class="text-center text-muted py-3">불러오는 중...</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<!-- 평가 입력 모달 -->
<div class="modal fade" id="evalModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h6 class="modal-title" id="evalModalTitle">학생 평가</h6>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="panel py-2 px-3 mb-3" style="background:var(--light-gray);">
          <div class="row" style="font-size:13px;">
            <div class="col-6 col-md-3"><b>이수시간</b><br><span id="evalInfoHours">-</span></div>
            <div class="col-6 col-md-3"><b>취업여부</b><br><span id="evalInfoEmployment">-</span></div>
            <div class="col-6 col-md-3"><b>학습평가 점수</b><br><span id="evalInfoExam">-</span></div>
            <div class="col-6 col-md-3"><b>TOPIK</b><br><span id="evalInfoTopik">-</span></div>
          </div>
        </div>

        <form id="evalForm">
          <input type="hidden" name="student_id">

          <div class="row g-3">
            <div class="col-12"><div class="fw-bold" style="color:var(--navy);">사업 참여도</div></div>
            <div class="col-md-6">
              <label class="form-label small">프로그램 참여 성실도 <span class="text-muted">(교육·비교과·현장 출석률/성실성, 0~15점)</span></label>
              <input type="number" min="0" max="15" class="form-control form-control-sm eval-score" name="score_participation" data-max="15">
            </div>
            <div class="col-md-6">
              <label class="form-label small">사업 이해도 <span class="text-muted">(사업목적·비자(E-7 등) 이해, 0~10점)</span></label>
              <input type="number" min="0" max="10" class="form-control form-control-sm eval-score" name="score_understanding" data-max="10">
            </div>

            <div class="col-12 mt-3"><div class="fw-bold" style="color:var(--navy);">역량 성장도</div></div>
            <div class="col-md-6">
              <label class="form-label small">전공·직무 역량 향상 <span class="text-muted">(0~15점)</span></label>
              <input type="number" min="0" max="15" class="form-control form-control-sm eval-score" name="score_major_skill" data-max="15">
            </div>
            <div class="col-md-6">
              <label class="form-label small">한국어·의사소통 능력 <span class="text-muted">(TOPIK·직무 한국어, 0~10점)</span></label>
              <input type="number" min="0" max="10" class="form-control form-control-sm eval-score" name="score_korean" data-max="10">
            </div>

            <div class="col-12 mt-3"><div class="fw-bold" style="color:var(--navy);">취업 준비도</div></div>
            <div class="col-md-6">
              <label class="form-label small">취업 준비 활동 <span class="text-muted">(이력서·자소서·면접 준비, 0~15점)</span></label>
              <input type="number" min="0" max="15" class="form-control form-control-sm eval-score" name="score_job_prep" data-max="15">
            </div>
            <div class="col-md-6">
              <label class="form-label small">현장 적응 역량 <span class="text-muted">(근태·태도·조직적응, 0~10점)</span></label>
              <input type="number" min="0" max="10" class="form-control form-control-sm eval-score" name="score_field_adapt" data-max="10">
            </div>

            <div class="col-12 mt-3"><div class="fw-bold" style="color:var(--navy);">취업 성과</div></div>
            <div class="col-md-6">
              <label class="form-label small">취업 연계 성과 <span class="text-muted">(인턴십·채용연계·취업확정, 0~10점)</span></label>
              <input type="number" min="0" max="10" class="form-control form-control-sm eval-score" name="score_employment" data-max="10">
            </div>

            <div class="col-12 mt-3"><div class="fw-bold" style="color:var(--navy);">종합 평가</div></div>
            <div class="col-md-6">
              <label class="form-label small">성장 및 발전 가능성 <span class="text-muted">(정주·발전 의지, 0~15점)</span></label>
              <input type="number" min="0" max="15" class="form-control form-control-sm eval-score" name="score_growth" data-max="15">
            </div>

            <div class="col-12 mt-3">
              <label class="form-label small">평가 의견 (선택)</label>
              <textarea class="form-control form-control-sm" name="comment" rows="2"></textarea>
            </div>
          </div>
        </form>

        <div class="panel mt-3 py-2 px-3 d-flex justify-content-between align-items-center" style="background:#EEF2FB;">
          <div style="font-weight:700; color:var(--navy);">합계 <span id="evalTotalScore">0</span> / 100점</div>
          <div id="evalGradeBadge" class="badge-status" style="font-size:14px;">미평가</div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-navy btn-sm" id="saveEvalBtn">저장</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/evaluations.js"></script>
</body>
</html>
